name: Host simulator screenshots

# Builds the SDL host simulator and photographs its own screen with the
# player's built-in screenshot path (main.c: /tmp/sonix/shot). Nothing here
# runs on the device; this is only a way to see what the interface looks like
# without a compiler on hand.
on:
  push:
    branches: [ci/host-sim]
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libsdl2-dev libfreetype-dev libopusfile-dev libwavpack-dev libasound2-dev \
            xvfb imagemagick ffmpeg sqlite3 fonts-dejavu-core

      - name: Build the host simulator
        working-directory: sonix-player
        run: make host -j"$(nproc)"

      - name: Prepare resources and a test card
        working-directory: sonix-player
        run: |
          set -euo pipefail
          mkdir -p usr/resource
          cp -r ../sonix-packer/assets/R3PII/usr/resource/sonix usr/resource/

          mkdir -p /tmp/sd/Music /tmp/sonix

          # The screenshot writer uses storage_sd_root(), which on the host is
          # the device mount path and not SONIX_SD_ROOT.
          sudo mkdir -p /mnt/sd_0/Screenshots
          sudo chown -R "$USER":"$USER" /mnt/sd_0

          # A silent null PCM, so the restored track actually plays: without a
          # card the decoder opens "default", fails, and the track ends at once
          # with the progress bar parked at zero.
          cat > "$HOME/.asoundrc" <<'EOF'
          pcm.!default { type null }
          EOF

          # A sleeve with some colour in it, so the blurred backdrop and the
          # cover accent have something to work from.
          convert -size 640x640 gradient:'#1b2a41-#c9773a' \
            -font DejaVu-Sans -gravity center -pointsize 56 -fill white \
            -annotate 0 'Simulator Sessions' /tmp/cover.png

          # Three minutes, so the progress bar sits well away from both ends.
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=220:duration=180" \
            -i /tmp/cover.png -map 0:a -map 1:v -c:a libmp3lame -b:a 192k \
            -c:v png -id3v2_version 3 \
            -metadata title="Midnight Drive" -metadata artist="The Testers" \
            -metadata album="Simulator Sessions" \
            -metadata:s:v title="Album cover" -metadata:s:v comment="Cover (front)" \
            -disposition:v attached_pic /tmp/sd/Music/test.mp3

          # The same track without a sleeve, to see the plain panel -- the one
          # place the light theme differs.
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=330:duration=180" \
            -c:a libmp3lame -b:a 320k -id3v2_version 3 \
            -metadata title="Paper Skies" -metadata artist="No Cover" \
            -metadata album="B-Sides" /tmp/sd/Music/test-nocover.mp3

          mk_base() {
            cat > "$1" <<EOF
          [ui]
          language=English
          dark_theme=$2

          [clock]
          configured=1

          [player]
          remember_track=1

          [music]
          nowplaying_at_boot=true

          [screen]
          player_layout_alt=$3
          EOF
          }

          mk_base /tmp/sonix/dark.ini true 0
          mk_base /tmp/sonix/light.ini false 0
          mk_base /tmp/sonix/studio.ini true 2
          mk_base /tmp/sonix/light-nocover.ini false 0

      - name: First run, to create the card database
        working-directory: sonix-player
        run: |
          set -euo pipefail
          mkdir -p screenshots
          export SONIX_CONFIG=/tmp/sonix/dark.ini SONIX_SD_ROOT=/tmp/sd
          export SONIX_NO_MOUNT=1 SONIX_NO_SYSSERVER=1
          timeout -k 5s 25s xvfb-run -a -s "-screen 0 480x800x24" ./sonix_player_host \
            > /tmp/sonix/first-run.log 2>&1 || true
          tail -30 /tmp/sonix/first-run.log
          cp /tmp/sonix/first-run.log screenshots/first-run.log
          ls -la /tmp/sd/.local

      - name: Seed the remembered track
        run: |
          set -euo pipefail
          # Which of the two roots the database landed in depends on whether
          # the simulator reads /mnt/sd_0 as writable, so find the one that
          # actually carries the schema rather than guessing.
          DB=""
          for f in /tmp/sd/.local/library.db /tmp/.local/library.db /mnt/sd_0/.local/library.db; do
            if [ -f "$f" ] && sqlite3 "$f" ".schema PLAYBACK_STATE" 2>/dev/null | grep -q PLAYBACK_STATE; then
              DB="$f"
              break
            fi
          done
          if [ -z "$DB" ]; then
            echo "no library database with a PLAYBACK_STATE table:"
            find /tmp /mnt/sd_0 -maxdepth 5 -name '*.db' 2>/dev/null
            exit 1
          fi
          echo "seeding $DB"
          sqlite3 "$DB" \
            "INSERT OR REPLACE INTO PLAYBACK_STATE(id,path,position,updated_at) \
             VALUES(0,'/tmp/sd/Music/test.mp3',42.0,strftime('%s','now'));"
          sqlite3 "$DB" "SELECT * FROM PLAYBACK_STATE;"

      - name: Photograph the player
        working-directory: sonix-player
        run: |
          set -euo pipefail
          mkdir -p screenshots

          find_db() {
            local f
            for f in /tmp/sd/.local/library.db /tmp/.local/library.db /mnt/sd_0/.local/library.db; do
              if [ -f "$f" ] && sqlite3 "$f" ".schema PLAYBACK_STATE" 2>/dev/null | grep -q PLAYBACK_STATE; then
                echo "$f"
                return 0
              fi
            done
            return 1
          }

          shoot() {
            local config="$1" name="$2" track="$3"
            local db
            db="$(find_db)" || { echo "no database for ${name}"; return 1; }
            sqlite3 "$db" \
              "INSERT OR REPLACE INTO PLAYBACK_STATE(id,path,position,updated_at) \
               VALUES(0,'${track}',42.0,strftime('%s','now'));"
            export SONIX_CONFIG="$config" SONIX_SD_ROOT=/tmp/sd
            export SONIX_NO_MOUNT=1 SONIX_NO_SYSSERVER=1
            ( sleep 16; touch /tmp/sonix/shot ) &
            timeout -k 5s 28s xvfb-run -a -s "-screen 0 480x800x24" ./sonix_player_host \
              > "/tmp/sonix/run-${name}.log" 2>&1 || true
            wait || true
            tail -40 "/tmp/sonix/run-${name}.log"
            cp "/tmp/sonix/run-${name}.log" "screenshots/${name}.log"
            sleep 1
            local newest
            newest="$(ls -t /mnt/sd_0/Screenshots/*.png 2>/dev/null | head -1 || true)"
            if [ -n "$newest" ]; then
              cp "$newest" "screenshots/${name}.png"
            else
              echo "no screenshot for ${name}"
            fi
          }

          shoot /tmp/sonix/dark.ini standard-dark /tmp/sd/Music/test.mp3
          shoot /tmp/sonix/light.ini standard-light /tmp/sd/Music/test.mp3
          shoot /tmp/sonix/studio.ini studio-dark /tmp/sd/Music/test.mp3
          shoot /tmp/sonix/light-nocover.ini standard-light-nocover /tmp/sd/Music/test-nocover.mp3

          ls -la screenshots

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-simulator-shots
          path: sonix-player/screenshots/*
          if-no-files-found: warn
